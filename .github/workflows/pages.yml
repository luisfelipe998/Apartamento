name: Publicar lista de presentes
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar
        run: npm test
      - name: Preparar acesso criptografado
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GIFT_GITHUB_TOKEN }}
          GIFT_PASSWORD: ${{ secrets.GIFT_PASSWORD }}
          GITHUB_OWNER: luisfelipe998
          GITHUB_REPO: Apartamento
          GITHUB_AUTHOR: luisfelipe998
          GITHUB_ISSUE_NUMBER: '1'
          REQUIRE_GITHUB_TOKEN: 'true'
          REQUIRE_GIFT_PASSWORD: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
